version: '2'
      
services:
  gpu:
    build: ./gpu
    privileged: true
    labels:
      io.balena.features.extra-firmware: '1'
      io.balena.features.dbus: '1'
  cuda:
    build: ./cuda
    privileged: true
    depends_on: 
     - gpu 
  app:
    build: ./app
    privileged: true
    depends_on: 
      - gpu 
  nv-pytorch:
    build: ./nvidia-base-image
    privileged: true
    depends_on: 
      - gpu 
